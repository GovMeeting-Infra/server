name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two deploys at once, and never cancel one midway — a half-finished rsync
# leaves dist/ inconsistent with node_modules.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  APP_DIR: /opt/govmeeting/server
  PM2_APP: govmeeting-api

jobs:
  deploy:
    name: Check, build, ship, reload
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      # See pr.yml — @nestjs/swagger's peer range makes this mandatory.
      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      # Advisory for the same reason as in pr.yml — a deploy must not be blocked
      # by a pre-existing lint backlog.
      - name: Lint (advisory)
        continue-on-error: true
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      # The whole point of building here: `next build` and `nest build` want
      # RAM and both cores, and the instance is also serving traffic.
      - name: Build
        run: npm run build

      # GitHub masks secret values in logs, so a bad one cannot be printed. This
      # reports its shape instead, and fails here rather than inside scp with
      # "hostname contains invalid characters" and no indication which secret is
      # at fault. Whitespace is stripped because a trailing newline pasted into
      # the secret box is the usual culprit.
      #
      # Named SSH_USER, not USER: the runner already defines USER, and
      # overriding it per step is a good way to confuse the next reader.
      - name: Validate deploy secrets
        env:
          IN_HOST: ${{ secrets.EC2_HOST }}
          IN_USER: ${{ secrets.EC2_USER }}
          IN_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          host=$(printf '%s' "$IN_HOST" | tr -d '[:space:]')
          user=$(printf '%s' "$IN_USER" | tr -d '[:space:]')
          [ -n "$host" ] || { echo "::error::EC2_HOST is empty or unset"; exit 1; }
          [ -n "$user" ] || { echo "::error::EC2_USER is empty or unset"; exit 1; }
          [ -n "$IN_KEY" ] || { echo "::error::EC2_SSH_KEY is empty or unset"; exit 1; }
          case "$host" in
            *://*) echo "::error::EC2_HOST has a scheme. Use a bare host or IP: 44.215.193.61, not https://44.215.193.61"; exit 1 ;;
            *@*)   echo "::error::EC2_HOST includes a user. Put the login in EC2_USER and only the host here"; exit 1 ;;
            *:*)   echo "::error::EC2_HOST includes a port or path. Use only the host or IP"; exit 1 ;;
            */*)   echo "::error::EC2_HOST includes a path. Use only the host or IP"; exit 1 ;;
          esac
          case "$user" in
            *@*|*/*|*:*) echo "::error::EC2_USER must be just the login name, e.g. ec2-user"; exit 1 ;;
          esac
          case "$IN_KEY" in
            *"OPENSSH PRIVATE KEY"*|*"RSA PRIVATE KEY"*|*"EC PRIVATE KEY"*) ;;
            *) echo "::error::EC2_SSH_KEY does not look like a private key. Paste the whole file including the BEGIN/END lines — not the .pub"; exit 1 ;;
          esac
          echo "host length ${#host}, user length ${#user}, key length ${#IN_KEY}"
          echo "SSH_HOST=$host" >> "$GITHUB_ENV"
          echo "SSH_USER=$user" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          # Fails clearly on a wrong key or a closed port 22, rather than
          # letting the first real command carry the blame.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'echo "connected to $(hostname)"'

      # tar over scp rather than rsync: rsync has to exist on BOTH ends, and the
      # Amazon Linux AMI does not ship it. tar and scp are always there.
      #
      # Only build output and manifests travel. .env and logs/ live on the
      # instance and are never in the archive, so they cannot be clobbered.
      - name: Package build output
        run: |
          tar czf deploy.tar.gz \
            dist generated prisma \
            package.json package-lock.json ecosystem.config.js
          ls -lh deploy.tar.gz

      - name: Upload
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy.tar.gz "$SSH_USER@$SSH_HOST:/tmp/api-deploy.tar.gz"

      # Migrations run here rather than in CI so the database credentials never
      # leave the instance — prisma.config.ts reads DIRECT_URL from its .env.
      # That is also why this is a full install: --omit=dev would drop the
      # Prisma CLI (and ts-node, which seed-accounts.ts needs).
      #
      # It must be the DIRECT endpoint. Neon's pooler is PgBouncer in
      # transaction mode and breaks the advisory locks migrate relies on;
      # prisma.config.ts already prefers DIRECT_URL over DATABASE_URL.
      #
      # Never add a seed step. prisma/seed.ts creates super@gov.sl,
      # admin@med.gov.sl and staff@moh.gov.sl with a shared password, and a push
      # to main must not recreate those on a government production database.
      #
      # Reload names one app on purpose. Both repos share a PM2 daemon, so
      # `pm2 reload all` would bounce the web app on every API deploy.
      - name: Install, migrate and reload
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" bash -euo pipefail <<EOF
            cd $APP_DIR
            # Replace rather than merge, so a file deleted in this release does
            # not linger in dist/ and get required by something stale.
            rm -rf dist generated
            tar xzf /tmp/api-deploy.tar.gz
            rm -f /tmp/api-deploy.tar.gz
            npm ci --legacy-peer-deps
            npx prisma migrate deploy
            mkdir -p logs
            pm2 reload $PM2_APP --update-env
            pm2 save
          EOF

      # /health pings Postgres and Redis, so this catches a bad DATABASE_URL or
      # REDIS_URL that a plain "is it listening" check would pass.
      - name: Verify
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" bash -euo pipefail <<'EOF'
            body=""
            # `if` rather than `curl ... && break`, so a failed attempt does not
            # trip set -e and abort the retry loop on the first try.
            for i in $(seq 1 12); do
              if body=$(curl -fsS --max-time 5 http://127.0.0.1:4000/api/v1/health); then break; fi
              echo "waiting for the API to come back ($i/12)"; sleep 5
            done
            [ -n "$body" ] || { echo "::error::API did not respond within 60s"; exit 1; }
            echo "$body"
            echo "$body" | grep -q '"database":{"status":"connected"' || {
              echo "::error::API is up but cannot reach the database"; exit 1; }
            echo "$body" | grep -q '"redis":{"status":"connected"' \
              || echo "::warning::API is serving but Redis is unreachable — cache and queued email are degraded"
          EOF

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Deploy failed. The previous build is still running on the instance — PM2 only reloads after the new build has landed."
